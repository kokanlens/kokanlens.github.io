:root{
  --green:#0f3d2e; --green2:#1c5a43; --terra:#b5532a; --saffron:#f2a516;
  --cream:#fbf5e6; --sand:#f1e6cc; --kokum:#5b1e3a; --ink:#22291f;

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Mukta','Poppins',Arial,sans-serif;background:var(--cream);color:var(--ink);line-height:1.6;overflow-x:hidden}
img{max-width:100%;display:block}
a{text-decoration:none;color:inherit}
.wrap{max-width:1100px;margin:auto;padding:0 18px}

/* NAV */
.topbar{position:sticky;top:0;z-index:50;background:rgba(15,61,46,.92);backdrop-filter:blur(10px);border-bottom:2px solid var(--saffron)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:10px;padding-bottom:10px}
.logo{font-family:'Poppins',sans-serif;font-weight:800;color:#fff;font-size:20px;white-space:nowrap}
.logo span{color:var(--saffron)}
.links{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;justify-content:center}
.links::-webkit-scrollbar{display:none}
.links a{color:#fff;font-weight:600;font-size:14px;padding:6px 12px;border-radius:999px;white-space:nowrap}
.links a:hover{background:var(--saffron);color:var(--green)}
.lang select{padding:7px 10px;border-radius:999px;border:0;background:var(--saffron);color:var(--green);font-weight:700;font-family:inherit}

/* BANNER + HERO */
.banner img{width:100%;height:auto}
.hero{background:linear-gradient(160deg,var(--green),var(--green2));color:#fff;text-align:center;padding:56px 18px 64px;position:relative}
.hero:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:28px;background:var(--cream);clip-path:polygon(0 100%,100% 100%,100% 0,95% 60%,90% 10%,85% 70%,80% 20%,75% 70%,70% 10%,65% 60%,60% 20%,55% 70%,50% 10%,45% 60%,40% 20%,35% 70%,30% 10%,25% 60%,20% 20%,15% 70%,10% 10%,5% 60%,0 20%)}
.chip{display:inline-block;background:var(--saffron);color:var(--green);font-weight:800;font-size:13px;padding:6px 16px;border-radius:999px;margin-bottom:16px;letter-spacing:.5px}
.hero h1{font-family:'Poppins','Mukta',sans-serif;font-size:clamp(30px,6vw,56px);line-height:1.15;font-weight:800;margin-bottom:14px}
.hero h1 em{font-style:normal;color:var(--saffron)}
.hero p{max-width:620px;margin:0 auto 26px;font-size:18px;opacity:.95}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 26px;border-radius:14px;font-weight:800;font-size:16px;transition:.2s;border:2px solid transparent;cursor:pointer;font-family:inherit}
.btn.red{background:#ff0033;color:#fff;box-shadow:0 8px 24px rgba(255,0,51,.35)}
.btn.red:hover{transform:translateY(-3px) scale(1.03)}
.btn.ghost{background:transparent;color:#fff;border-color:#fff}
.btn.ghost:hover{background:#fff;color:var(--green)}

/* MARQUEE */
.marquee{background:var(--saffron);color:var(--green);overflow:hidden;white-space:nowrap;padding:12px 0;font-weight:800;font-family:'Poppins','Mukta',sans-serif;transform:rotate(-1deg);margin:18px -10px;border-block:3px solid var(--green)}
.marquee div{display:inline-block;animation:slide 28s linear infinite}
@keyframes slide{to{transform:translateX(-50%)}}

/* SECTIONS */
section{padding:64px 0}
.kicker{color:var(--terra);font-weight:800;letter-spacing:2px;font-size:13px;text-transform:uppercase;text-align:center}
.title{font-family:'Poppins','Mukta',sans-serif;font-size:clamp(26px,4.5vw,40px);font-weight:800;text-align:center;color:var(--green);margin:6px 0 10px}
.sub{max-width:640px;margin:0 auto 34px;text-align:center;color:#4a5546}
